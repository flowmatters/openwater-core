name: build-ow-core
on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - run: ./build/ci/all.sh
        - name: upload build
          uses: actions/upload-artifact@v4
          with:
            name: linux-${{ github.sha }}
            path: |
              ow-inspect
              ow-single
              ow-sim
              ows-ensemble
              libopenwater.h
              libopenwater.so
        - name: Zip nightly
          run: printf "ow-inspect\now-single\now-sim\nows-ensemble\nlibopenwater.h\nlibopenwater.so" | zip build.zip -@ 
        - name: Rename for versioned release
          if: github.ref_type == 'tag'
          run: mv build.zip build-linux.zip
        - name: Release Nightly
          if: github.ref_type != 'tag'
          uses: softprops/action-gh-release@v1
          with:
            name: ubuntu-Nightly
            files: build.zip
            fail_on_unmatched_files: true
            tag_name: Nightly-ubuntu
        - name: Release Version
          if: github.ref_type == 'tag'
          uses: softprops/action-gh-release@v1
          with:
            name: ${{ github.ref_name }}
            files: build-linux.zip
            fail_on_unmatched_files: true
            tag_name: ${{ github.ref_name }}
            draft: false
            prerelease: false
  build-windows:
    runs-on: windows-latest
    steps:
        - uses: actions/checkout@v4
        - name: build
          run: ./build/ci/all.sh
          shell: bash
        - name: upload build
          uses: actions/upload-artifact@v4
          with:
            name: windows-${{ github.sha }}
            path: |
              *.exe
              1.8.21/bin/*.dll
              libopenwater.h
              libopenwater.so
        - name: Zip Nightly
          run: |
            echo "Current directory:"
            pwd
            echo ""
            echo "Checking for binaries in ~/go/bin..."
            ls -la ~/go/bin/ 2>/dev/null | grep -E "\.(exe|dll)$" || echo "No binaries in ~/go/bin"
            echo ""
            echo "Checking for libopenwater in ../bin..."
            ls -la ../bin/ 2>/dev/null || echo "No ../bin directory"
            echo ""
            echo "Creating build archive..."
            mkdir -p build_temp
            # Copy executables from GOPATH/bin where 'go install' puts them
            cp ~/go/bin/ow-inspect.exe build_temp/ 2>/dev/null || echo "Warning: ow-inspect.exe not found"
            cp ~/go/bin/ow-single.exe build_temp/ 2>/dev/null || echo "Warning: ow-single.exe not found"
            cp ~/go/bin/ow-sim.exe build_temp/ 2>/dev/null || echo "Warning: ow-sim.exe not found"
            cp ~/go/bin/ows-ensemble.exe build_temp/ 2>/dev/null || echo "Warning: ows-ensemble.exe not found"
            # libopenwater files are in ../bin (parent directory)
            cp ../bin/libopenwater.h build_temp/ 2>/dev/null || echo "Warning: libopenwater.h not found"
            cp ../bin/libopenwater.so build_temp/ 2>/dev/null || echo "Warning: libopenwater.so not found"
            # Copy HDF5 DLLs
            cp 1.8.21/bin/*.dll build_temp/
            echo ""
            echo "Build temp contents:"
            ls -la build_temp/
            cd build_temp
            tar -acf ../build.zip *
            cd ..
          shell: bash
        - name: Rename for versioned release
          if: github.ref_type == 'tag'
          run: mv build.zip build-windows.zip
          shell: bash
        - name: Release Nightly
          if: github.ref_type != 'tag'
          uses: softprops/action-gh-release@v1
          with:
            name: windows-Nightly
            files: build.zip
            fail_on_unmatched_files: true
            tag_name: Nightly-windows
        - name: Release Version
          if: github.ref_type == 'tag'
          uses: softprops/action-gh-release@v1
          with:
            name: ${{ github.ref_name }}
            files: build-windows.zip
            fail_on_unmatched_files: true
            tag_name: ${{ github.ref_name }}
            draft: false
            prerelease: false
  build-osx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: ./build/ci/all.sh
      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ github.sha }}
          path: |
            ow-inspect
            ow-single
            ow-sim
            ows-ensemble
            libopenwater.h
            libopenwater.so
      - name: Zip nightly
        run: printf "ow-inspect\now-single\now-sim\nows-ensemble\nlibopenwater.h\nlibopenwater.so" | zip build.zip -@ 
      - name: Rename for versioned release
        if: github.ref_type == 'tag'
        run: mv build.zip build-macos.zip
      - name: Release Nightly
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v1
        with:
          name: osx-Nightly
          files: build.zip
          fail_on_unmatched_files: true
          tag_name: Nightly-osx
      - name: Release Version
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: build-macos.zip
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
